name: Börsen-Briefing aktualisieren

on:
  schedule:
    # Mo–Fr 21:35 UTC = 22:35 Uhr deutscher Winterzeit (23:35 Sommerzeit), nach US-Börsenschluss
    - cron: "35 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Den letzten Handelstag neu rechnen, auch wenn es ihn schon gibt"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Kurse laden und rechnen
        if: github.event_name != 'push'
        run: python scripts/update.py ${{ inputs.force && '--force' || '' }}

      - name: Neue Daten speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Briefing $(date -u +%F)"
            git push
          fi

      - name: Aktuelle Kurse (nur veröffentlicht, nicht gespeichert)
        continue-on-error: true
        run: python scripts/live.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
